name: Publicar site e recolher preços

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'miguelferreira19/meal-preap-mm-site'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verificar cálculos e recolhas
        run: npm test
      - name: Recolher preços reais dos supermercados
        env:
          PREVIOUS_SNAPSHOT_URL: https://miguelferreira19.github.io/meal-preap-mm-site/prices-snapshot.json
        run: node scripts/collect-prices.mjs
      - name: Preparar aplicação
        run: node scripts/build-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
